{const js=document.getElementById('js'),jk=document.getElementById('jk');let jid=null;
function jm(e){const r=js.getBoundingClientRect(),m=r.width/2-8;let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy);if(d>m){dx*=m/d;dy*=m/d}jk.style.transform='translate('+dx+'px,'+dy+'px)';const nx=dx/m,ny=dy/m;press('l',nx<-.3?1:0);press('r',nx>.3?1:0);press('u',ny<-.55?1:0)}

let S=[],HD=[],B=[],SP=[],MV=[],coins=[],proj=[],UP={},stage=1,gold=0,wardUsed=0,GOAL=0;

HD.forEach(h=>h.t=0);cam=0;parts=[];hs=0;zn='';read=new Set();cur=null;got=[0,0];ember=100;abil=1;shard=0;shadow=null;lastB=B[0];ls={x:60,y:280};say('등불지기가 깨어났어요')}

function upd(dt){
if(state!=='play'){E.j=E.a=E.d=E.f=E.i=E.p=0;return}
if(hs>0){hs-=dt;return}
T+=dt;p.par=(p.par||0)-dt;p.pc=(p.pc||0)-dt;if(E.p&&p.pc<=0&&p.dash<=0){p.par=.28+.06*(UP.pw||0);p.pc=.75;burst(p.x+9+p.face*10,p.y+13,5,'#9fe6ff',90)}p.jb=E.j?.16:(p.jb||0)-dt;mt-=dt;p.inv-=dt;p.dcd-=dt;p.atk-=dt;p.kb-=dt;p.coy-=dt;

else{const tv=mv*200*(1+.1*(UP.spd||0)),df=tv-p.vx,ac=(mv?(p.ground?2800:1700):(p.ground?3400:800))*dt;p.vx+=Math.sign(df)*Math.min(Math.abs(df),ac);if(mv)p.face=mv;p.vy=Math.min(p.vy+(Math.abs(p.vy)<90&&K.j?1100:(p.vy<0&&K.j?1300:1900))*dt,720);
if(E.d&&abil&&p.dcd<=0){p.dash=.16;p.dcd=Math.max(.2,.6-.12*(UP.cd||0));shake=3}
